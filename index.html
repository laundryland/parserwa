<script>
// PWA Manifest already via data URI
(function(){
  // Register Service Worker via Blob for single-file PWA
  if('serviceWorker' in navigator){
    try{
      const swCode = "\nself.addEventListener('install', e => {\n  e.waitUntil(\n    caches.open('laundry-land-v3').then(cache => {\n      return cache.addAll(['./']);\n    })\n  );\n  self.skipWaiting();\n});\nself.addEventListener('activate', e => {\n  e.waitUntil(\n    caches.keys().then(keys => Promise.all(keys.filter(k=>k!=='laundry-land-v3').map(k=>caches.delete(k))))\n  );\n  self.clients.claim();\n});\nself.addEventListener('fetch', e => {\n  if(e.request.method!=='GET') return;\n  e.respondWith(\n    caches.match(e.request).then(cached => {\n      return cached || fetch(e.request).then(res => {\n        return res;\n      }).catch(()=>caches.match('./'));\n    })\n  );\n});\n";
      const blob = new Blob([swCode], {type:'text/javascript'});
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).then(reg=>{
        console.log('SW registered PWA ready', reg.scope);
      }).catch(err=>console.log('SW fail', err));
    }catch(e){console.log('SW blob error', e)}
  }
  // BeforeInstallPrompt for Android
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt=e;
    console.log('PWA install prompt ready');
    // show custom button if you have id pwa-install-btn
    const btn=document.getElementById('pwa-install-btn');
    if(btn) btn.style.display='flex';
  });
  window.__triggerPWAInstall = async ()=>{
    if(!deferredPrompt){ alert('Untuk install: di Chrome Android tap ⋮ > Add to Home screen / Install app'); return; }
    deferredPrompt.prompt();
    const choice=await deferredPrompt.userChoice;
    console.log('PWA choice', choice);
    deferredPrompt=null;
  };
  window.addEventListener('appinstalled', ()=>{ console.log('PWA installed'); });
  
  // Enhanced Share: Web Share API + WA fallback (existing Rd already supports WA Bisnis)
  window.__shareLaundry = async (text, useWA4B=false) => {
    const txt=text||'Belum ada data';
    if(navigator.share && !useWA4B){
      try{ await navigator.share({title:'Laundry Land', text:txt}); return; }catch(e){}
    }
    // fallback to existing logic
    const x=encodeURIComponent(txt);
    const waUrl=`https://wa.me/?text=${x}`;
    try{ await navigator.clipboard.writeText(txt); }catch(e){}
    if(/Android/i.test(navigator.userAgent)){
      try{
        if(useWA4B) window.location.href=`intent://send?text=${x}#Intent;package=com.whatsapp.w4b;scheme=whatsapp;end`;
        else window.location.href=`whatsapp://send?text=${x}`;
      }catch(e){}
      setTimeout(()=>window.open(waUrl,'_blank'),1200);
    } else {
      window.open(waUrl,'_blank');
    }
  };
})();
</script>
